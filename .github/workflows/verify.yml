name: Verify research artefacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python -m pip install '.[dev,figures]'
      - name: Check the installed source register
        working-directory: ${{ runner.temp }}
        run: oph-fep-synergetics sources --json
      - name: Run tests and check coverage
        run: python -m pytest tests/ --cov --cov-report=term-missing
      - name: Verify correspondence probes
        run: oph-fep-synergetics verify
      - name: Check generated docs
        run: python scripts/render_docs.py --check
