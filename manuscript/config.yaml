# Manuscript configuration — OPH / FEP / Synergetics correspondence battery.
# This file is the configuration source of truth for the manuscript and for
# publication metadata; it is loaded with `yaml.safe_load` by
# `infrastructure/rendering/_pdf_title_page_config.py` and by the publishing
# metadata extractor. Keep every value literal: the renderer rejects a
# surviving `{{UPPER_SNAKE}}` token in this file.

paper:
  title: "Observers, Blankets, and Screens"
  subtitle: "Executable Correspondences, Obstructions, and Complementarities across Observer Patch Holography, the Free Energy Principle, and Fuller's Synergetics"
  version: "0.1.0"
  date: ""  # left empty: the renderer stamps the build date
  cover:
    # Page 1 summarises the carrier, lattice geometry and executable comparisons.
    image: "../output/figures/fig_cover.png"
    alt: "Three columns show the numbered icosahedral carrier, Gaussian port contrasts and the cuboctahedral FCC shell. The centre chart divides full intrinsic Gaussian contrast variance and squared chord length by their respective adjacent-port values. Squared chords rise faster with graph distance. The findings connect binary repair to conditional resampling, chords to the lowest Gaussian modes, and contrast the carrier and FCC neighbourhood counts. The FCC shell has two different contrast variances at graph distance two. A stacked bar shows the three registry claim kinds."

# Layout. The front-matter bound is a shade tighter than the ordinary one on
# purpose: the first figure in the document is panel 1 of the graphical
# abstract, and at 0.44 that panel's last line spilled onto a second page, which
# moved panels 2 to 4 one page later than `scripts/check_render.py` requires.
# Both are fractions of the text height.
rendering:
  section_breaks: true
  include_date: true
  cover_height_fraction: 0.51
  front_matter_figure_height_fraction: 0.42
  figure_height_fraction: 0.44

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true
  - name: "Bernhard Mueller"
    orcid: "0009-0002-5638-6240"
    affiliations:
      - "Pragma Research"
      - "Active Inference Institute"

publication:
  release_status: "unreleased"
  intended_version: "0.1.0"
  github_repository: "docxology/OPH-FEP-Synergetics"
  repository_url: "https://github.com/docxology/OPH-FEP-Synergetics"
  journal: ""
  volume: ""
  pages: ""
  year: "2026"
  transmission_bookends:
    enabled: false

keywords:
  - "observer patch holography"
  - "free energy principle"
  - "active inference"
  - "synergetics"
  - "quadray coordinates"
  - "cellular sheaves"
  - "Markov blankets"
  - "variational free energy"
  - "geodesic subdivision"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"
  tagged_pdf: true

# Format toggles, consumed by infrastructure/rendering/pipeline.py.
render:
  formats:
    pdf: true
    html: false
    slides: false
    docx: false
    epub: false

llm:
  reviews:
    enabled: false
  translations:
    enabled: false

testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Documentation for readers and downstream tooling; the correspondence
# registry itself lives in code (src/oph_fep_synergetics/analysis/registry.py)
# and is executed by `oph-fep-synergetics verify`.
project_config:
  registry:
    status_vocabulary: ["exact", "exact-on-domain", "obstructed", "not-reproduced"]
    kinds: ["isomorphism", "disagreement", "complementarity"]
    pairs: ["oph-fep", "fep-synergetics", "synergetics-oph", "three-way"]
    entry_count: 53
  sources:
    - "Observer Patch Holography"
    - "FEP_Formal"
    - "QuadMath (Synergetics)"
