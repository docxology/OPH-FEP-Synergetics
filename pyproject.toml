[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oph-fep-synergetics"
version = "0.1.0"
license = {text = "MIT"}
description = "Executable correspondences, obstructions, and complements across Observer Patch Holography, the Free Energy Principle, and Fuller's Synergetics"
readme = "README.md"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
figures = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
oph-fep-synergetics = "oph_fep_synergetics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short --strict-markers"
markers = [
    "slow: bounded integration checks kept for release profiles",
]

[tool.coverage.run]
source = ["src/oph_fep_synergetics"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
