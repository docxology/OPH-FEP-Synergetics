<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 368" width="820" height="368"
     role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Three examples from the correspondence ledger</title>
  <desc id="overview-description">In the linear-Gaussian model, harmonic extension and Gaussian inference give the same posterior mean. The icosahedral carrier and Synergetics' cuboctahedron give two arrangements of twelve spheres touching a central sphere. One lattice coordination shell can contain several Gaussian divergence values at unit covariance.</desc>

  <rect width="820" height="368" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="2.5">
    <path d="M352 85 136 278M468 85l216 193M232 310h357"/>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#172554">
      <rect x="260" y="19" width="300" height="68" rx="10"/>
      <rect x="18" y="275" width="215" height="70" rx="10"/>
      <rect x="587" y="275" width="215" height="70" rx="10"/>
    </g>
    <g fill="#ffffff" font-size="19" font-weight="700">
      <text x="410" y="48">Observer Patch Holography</text>
      <text x="125.5" y="304">Fuller’s Synergetics</text>
      <text x="694.5" y="304">Free Energy Principle</text>
    </g>
    <g fill="#dbeafe" font-size="17">
      <text x="410" y="71">Icosahedral repair</text>
      <text x="125.5" y="328">Quadrays and lattice shells</text>
      <text x="694.5" y="328">Variational inference</text>
    </g>

    <rect x="36" y="123" width="294" height="106" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="490" y="123" width="294" height="106" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
    <rect x="253" y="249" width="314" height="110" rx="10" fill="#fffbeb" stroke="#a16207"/>

    <g font-size="18" font-weight="700">
      <text x="183" y="151" fill="#5b21b6">Complementarity</text>
      <text x="637" y="151" fill="#115e59">Linear-Gaussian identity</text>
      <text x="410" y="277" fill="#854d0e">Obstruction</text>
    </g>
    <g fill="#172554" font-size="17">
      <text x="183" y="177">Cuboctahedral and icosahedral</text>
      <text x="183" y="198">arrangements each give twelve</text>
      <text x="183" y="219">contacts with a central sphere.</text>
      <text x="637" y="177">Harmonic extension and</text>
      <text x="637" y="198">Gaussian inference give</text>
      <text x="637" y="219">the same posterior mean.</text>
      <text x="410" y="303">One coordination shell</text>
      <text x="410" y="324">contains several Gaussian</text>
      <text x="410" y="345">divergence values.</text>
    </g>
  </g>
</svg>
