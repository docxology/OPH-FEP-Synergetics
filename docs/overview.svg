<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 368" width="820" height="368"
     role="img" aria-labelledby="overview-title overview-description">
  <title id="overview-title">Three examples from the correspondence ledger</title>
  <desc id="overview-description">Observer Patch Holography and the Free Energy Principle agree on harmonic extension and Gaussian perception in the linear-Gaussian model. Observer Patch Holography and Synergetics contribute distinct arrangements of twelve spheres touching a central sphere. A single Synergetics lattice shell can span several free energy levels.</desc>

  <rect width="820" height="368" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#64748b" stroke-width="2.5">
    <path d="M352 85 136 278M468 85l216 193M232 310h357"/>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#172554">
      <rect x="260" y="19" width="300" height="68" rx="10"/>
      <rect x="18" y="275" width="215" height="70" rx="10"/>
      <rect x="587" y="275" width="215" height="70" rx="10"/>
    </g>
    <g fill="#ffffff" font-size="19" font-weight="700">
      <text x="410" y="48">Observer Patch Holography</text>
      <text x="125.5" y="304">Fuller’s Synergetics</text>
      <text x="694.5" y="304">Free Energy Principle</text>
    </g>
    <g fill="#dbeafe" font-size="17">
      <text x="410" y="71">Icosahedral repair</text>
      <text x="125.5" y="328">Quadrays and lattice shells</text>
      <text x="694.5" y="328">Variational inference</text>
    </g>

    <rect x="36" y="125" width="294" height="91" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="490" y="125" width="294" height="91" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
    <rect x="253" y="261" width="314" height="98" rx="10" fill="#fffbeb" stroke="#a16207"/>

    <g font-size="18" font-weight="700">
      <text x="183" y="151" fill="#5b21b6">Complementarity</text>
      <text x="637" y="151" fill="#115e59">Correspondence</text>
      <text x="410" y="288" fill="#854d0e">Obstruction</text>
    </g>
    <g fill="#172554" font-size="17">
      <text x="183" y="177">Twelve spheres touch a central</text>
      <text x="183" y="199">sphere in two arrangements</text>
      <text x="637" y="177">Harmonic extension matches</text>
      <text x="637" y="199">settled linear-Gaussian inference</text>
      <text x="410" y="315">One lattice shell spans</text>
      <text x="410" y="337">several free energy levels</text>
    </g>
  </g>
</svg>
